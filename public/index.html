<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit a Ticket | MIS</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body>
  <header>
    <div class="nav-content">
      <a href="index.html" class="logo">
        <i class="fa-solid fa-satellite-dish"></i>
        MIS <span>Ticket Form</span>
      </a>
      <nav>
        <a href="login.html" class="btn btn-secondary btn-sm">Admin Login</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="form-container">
      <h2>Submit a Request</h2>
      <p style="color: var(--text-secondary); margin-bottom: 2rem;">Please provide details about your issue.</p>

      <div id="submitAlert" class="alert"></div>

      <form id="ticketForm">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" placeholder="E.g., John Doe" required>
        </div>

        <div class="form-group">
          <label for="department">Department</label>
          <select id="department" name="department" required>
            <option value="" disabled selected>Select your department</option>
            <option value="Development">Development</option>
            <option value="Support">Support</option>
            <option value="HR">HR</option>
            <option value="MIS">MIS</option>
            <option value="BA">BA (Business Analyst)</option>
            <option value="Marketing">Marketing</option>
            <option value="Finance">Finance</option>
          </select>
        </div>

        <div class="form-group">
          <label for="title">Issue Title</label>
          <input type="text" id="title" name="title" placeholder="Brief summary of the issue" required>
        </div>

        <div class="form-group">
          <label for="description">Detailed Description</label>
          <textarea id="description" name="description" rows="5"
            placeholder="Describe what went wrong or what you need help with..." required></textarea>
        </div>

        <button type="submit" class="btn btn-primary btn-block">
          <i class="fa-solid fa-paper-plane" style="margin-right: 0.5rem;"></i> Submit Ticket
        </button>
      </form>
    </div>
  </main>

  <script src="js/main.js"></script>
</body>

</html>
