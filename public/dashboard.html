<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIS Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body>
    <header>
        <div class="nav-content">
            <a href="dashboard.html" class="logo">
                <i class="fa-solid fa-satellite-dish"></i>
                MIS <span>Dashboard</span>
            </a>
            <nav style="display: flex; gap: 1rem; align-items: center;">
                <span style="color: var(--text-secondary); font-size: 0.875rem;">Welcome, Administrator</span>
                <button id="logoutBtn" class="btn btn-secondary btn-sm">
                    <i class="fa-solid fa-right-from-bracket" style="margin-right: 0.5rem;"></i> Logout
                </button>
            </nav>
        </div>
    </header>

    <main class="dashboard-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <div>
                <h2>IT Service Tickets</h2>
                <p style="color: var(--text-secondary);">Manage and resolve incoming employee requests.</p>
            </div>
            <div style="display: flex; gap: 1rem;">
                <button class="btn btn-primary btn-sm" onclick="openCreateModal()">
                    <i class="fa-solid fa-plus" style="margin-right: 0.5rem;"></i> Create Ticket
                </button>
                <button class="btn btn-secondary btn-sm" onclick="fetchTickets()">
                    <i class="fa-solid fa-rotate-right" style="margin-right: 0.5rem;"></i> Refresh
                </button>
            </div>
        </div>

        <div id="dashboardAlert" class="alert"></div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Requester</th>
                        <th>Department</th>
                        <th>Title</th>
                        <th>Status</th>
                        <th>Submitted</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="ticketsTableBody">
                    <!-- Tickets will be loaded here via JS -->
                </tbody>
            </table>
            <div id="loadingIndicator" style="text-align: center; padding: 2rem; color: var(--text-secondary);">
                <i class="fa-solid fa-circle-notch fa-spin"></i> Loading tickets...
            </div>
            <div id="emptyState"
                style="text-align: center; padding: 3rem; color: var(--text-secondary); display: none;">
                <i class="fa-solid fa-inbox"
                    style="font-size: 3rem; margin-bottom: 1rem; color: var(--glass-border);"></i>
                <p>No tickets found in the system.</p>
            </div>
        </div>
    </main>

    <!-- Ticket Details/Create Modal -->
    <div id="ticketModal" class="modal-overlay">
        <div class="modal" style="max-width: 700px;">
            <div class="modal-header">
                <h2 id="modalTitleText">Ticket Details</h2>
                <button class="modal-close" onclick="closeModal()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="modalForm">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem;">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label for="modalName">Requester Name</label>
                        <input type="text" id="modalName" required>
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label for="modalDepartment">Department</label>
                        <select id="modalDepartment" required>
                            <option value="Development">Development</option>
                            <option value="Support">Support</option>
                            <option value="HR">HR</option>
                            <option value="MIS">MIS</option>
                            <option value="BA">BA</option>
                            <option value="Marketing">Marketing</option>
                            <option value="Finance">Finance</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="modalTitleInput">Issue Title</label>
                    <input type="text" id="modalTitleInput" required>
                </div>

                <div class="form-group">
                    <label for="modalDescriptionInput">Description</label>
                    <textarea id="modalDescriptionInput" rows="5" required></textarea>
                </div>

                <div class="form-group">
                    <label for="modalStatus">Status</label>
                    <select id="modalStatus" required>
                        <option value="Open">Open</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Resolved">Resolved</option>
                    </select>
                </div>

                <div
                    style="margin-top: 2.5rem; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--glass-border); padding-top: 1.5rem;">
                    <button type="button" id="deleteBtn" class="btn btn-secondary"
                        style="border-color: var(--danger); color: var(--danger);" onclick="deleteTicket()">
                        <i class="fa-solid fa-trash-can" style="margin-right: 0.5rem;"></i> Delete
                    </button>
                    <div style="display: flex; gap: 1rem;">
                        <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                        <button type="submit" class="btn btn-primary" id="saveBtn">Save Changes</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        // Specific logic for dashboard
        if (!localStorage.getItem('token')) {
            window.location.href = 'login.html';
        } else {
            setTimeout(fetchTickets, 100);
        }
    </script>
</body>

</html>
